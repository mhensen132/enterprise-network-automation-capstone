---
- name: Deploy Ubuntu web tier on KVM host
  hosts: kvm_hosts
  become: true
  gather_facts: true

  vars:
    vm_prefix: web
    vm_count: 3
    vm_memory_mb: 2048
    vm_cpus: 2
    vm_disk_size_gb: 20
    vm_network: default
    vm_pool_dir: /var/lib/libvirt/images/pool
    ubuntu_image: /var/lib/libvirt/images/pool/jammy-server-cloudimg-amd64.img
    ubuntu_image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
    ssh_public_key: "{{ lookup('file', '/home/ansible/.ssh/id_ed25519.pub') }}"

  tasks:
    - name: Ensure VM image directory exists
      ansible.builtin.file:
        path: "{{ vm_pool_dir }}"
        state: directory
        mode: "0755"

    - name: Download Ubuntu cloud image if missing
      ansible.builtin.get_url:
        url: "{{ ubuntu_image_url }}"
        dest: "{{ ubuntu_image }}"
        mode: "0644"

    - name: Create VM disk images
      ansible.builtin.command: >
        qemu-img create -f qcow2
        -b {{ ubuntu_image }}
        -F qcow2
        {{ vm_pool_dir }}/{{ vm_prefix }}{{ item }}.qcow2
        {{ vm_disk_size_gb }}G
      args:
        creates: "{{ vm_pool_dir }}/{{ vm_prefix }}{{ item }}.qcow2"
      loop: "{{ range(1, vm_count + 1) | list }}"

    - name: Create cloud-init user-data files
      ansible.builtin.copy:
        dest: "/tmp/{{ vm_prefix }}{{ item }}-user-data"
        content: |
          #cloud-config
          hostname: {{ vm_prefix }}{{ item }}
          users:
            - name: ubuntu
              sudo: ALL=(ALL) NOPASSWD:ALL
              groups: sudo
              shell: /bin/bash
              ssh_authorized_keys:
                - {{ ssh_public_key }}
          package_update: true
          packages:
            - qemu-guest-agent
            - nginx
          write_files:
            - path: /var/www/html/index.html
              content: |
                <html>
                  <head><title>{{ vm_prefix }}{{ item }}</title></head>
                  <body>
                    <h1>{{ vm_prefix }}{{ item }}</h1>
                    <p>Deployed by Ansible, KVM/libvirt, and cloud-init.</p>
                  </body>
                </html>
          runcmd:
            - systemctl enable nginx
            - systemctl start nginx
      loop: "{{ range(1, vm_count + 1) | list }}"

    - name: Create cloud-init meta-data files
      ansible.builtin.copy:
        dest: "/tmp/{{ vm_prefix }}{{ item }}-meta-data"
        content: |
          instance-id: {{ vm_prefix }}{{ item }}
          local-hostname: {{ vm_prefix }}{{ item }}
      loop: "{{ range(1, vm_count + 1) | list }}"

    - name: Build cloud-init seed ISOs
      ansible.builtin.command: >
        cloud-localds
        {{ vm_pool_dir }}/{{ vm_prefix }}{{ item }}-seed.iso
        /tmp/{{ vm_prefix }}{{ item }}-user-data
        /tmp/{{ vm_prefix }}{{ item }}-meta-data
      args:
        creates: "{{ vm_pool_dir }}/{{ vm_prefix }}{{ item }}-seed.iso"
      loop: "{{ range(1, vm_count + 1) | list }}"

    - name: Define and start VMs
      ansible.builtin.command: >
        virt-install
        --name {{ vm_prefix }}{{ item }}
        --memory {{ vm_memory_mb }}
        --vcpus {{ vm_cpus }}
        --disk path={{ vm_pool_dir }}/{{ vm_prefix }}{{ item }}.qcow2,format=qcow2
        --disk path={{ vm_pool_dir }}/{{ vm_prefix }}{{ item }}-seed.iso,device=cdrom
        --os-variant ubuntu22.04
        --network network={{ vm_network }}
        --graphics none
        --console pty,target_type=serial
        --import
        --noautoconsole
      args:
        creates: "/etc/libvirt/qemu/{{ vm_prefix }}{{ item }}.xml"
      loop: "{{ range(1, vm_count + 1) | list }}"